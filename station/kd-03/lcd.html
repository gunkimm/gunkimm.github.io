         --lh:1.30; --fs:13px; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #scr{position:fixed;inset:0;padding:6px 10px;overflow:hidden;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;
    font-size:var(--fs);line-height:var(--lh);color:var(--ink);

  .dim{opacity:.40} .mid{opacity:.72} .q{color:var(--grey);text-shadow:none}
  .w{color:var(--warn)}
  .e{background:var(--ink);color:var(--bg);text-shadow:none;display:inline-block}

    background:rgba(14,14,14,.95);border-left:1px solid #333;color:#aaa;

  .hint{color:#666;line-height:1.55;margin-top:9px;border-top:1px solid #333;padding-top:8px}
  #tog{position:fixed;top:7px;right:208px;z-index:6;width:21px;height:21px;border:1px solid #555;
    background:rgba(0,0,0,.6);color:#999;cursor:pointer;text-align:center;line-height:19px;
    font-family:monospace;font-size:12px}
  #tog.out{right:7px}
  body.bare #panel,body.bare #tog{display:none}
  body.bare{cursor:none}

<script>
/* ---------- TRACER ---------- */
/* ============================================================
   TRACER — soul_tick() 을 연산 단위로 해체한다.
   요약하지 않는다. 커널이 실제로 수행하는 연산을 하나씩 뱉는다.
   값은 전부 q16.16 로 저장된 뒤의 것이다.
   ============================================================ */
(function(root){

const Q   = v => Math.round(v * 65536);          // 저장
const DQ  = r => r / 65536;                      // 복원
const QV  = v => DQ(Q(v));                       // 저장 후 복원된 값
const hx  = r => '0x' + ((r<0 ? (r>>>0) : r)).toString(16).padStart(8,'0');
const pad = (s,n)=> (String(s)+' '.repeat(n)).slice(0, Math.max(n, String(s).length));
const rp  = (s,n)=> ' '.repeat(Math.max(0, n-String(s).length)) + s;
const dec = v => (v<0?'-':'') + Math.abs(v).toFixed(8);

function mulberry32(a){ return function(){
  a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const QKEYS = ['FUEL_DECAY','MOOD_DECAY','SLEEP_FACTOR','SCRAP_RATE',
               'FAULT_PER_SCRAP','GROWTH_GAIN','MISTAKE_DRAG'];

/* 한 유닛의 생애를 연산 단위로 흘려보내는 코루틴 */
function Unit(soul, seed, STAGE){
  const P = {};
  for(const k in soul.p) P[k] = QKEYS.indexOf(k) >= 0 ? QV(soul.p[k]) : soul.p[k];
  const ST = STAGE.map(QV);
  const rnd = mulberry32(seed);
  const u = soul.code.slice(3);                       // B01, V02 ...

  const s = { min:0, hour:9, fuel:4, mood:4, scrap:0, lv:0, exp:0,
              fault:false, dose:0, faultMin:0, starveMin:0, mistakes:0,
              call:false, callMin:0, called:false, light:true, darkMin:0,
              nightCounted:false, dead:false, cause:'', stage:0 };

  let k = 0, q = [], asleep = false, kf = 1, d = 0, md = 0, grew = false;
  const OUT = [];
  const PC = () => String(s.min).padStart(6,'0') + '.' + String(k).padStart(2,'0');
  const op = (mn, operand, raw, val, cls) =>
    OUT.push({ u, pc: PC(), kind:'op',
               mn, operand, hex: raw===null?'':hx(raw), dec: val===null?'':dec(val), cls });
  const ev = (tag, note, cls) =>
    OUT.push({ u, pc: PC(), kind:'ev', tag, note, cls:cls||'w' });
  const hard = (txt) =>
    OUT.push({ u, pc: PC(), kind:'hard', note:txt, cls:'e' });

  function asleepAt(h){ const f=P.SLEEP_FROM, t=P.SLEEP_TO;
    if(f < 0) return false;
    return f > t ? (h >= f || h < t) : (h >= f && h < t); }

  /* 한 게임분을 통째로 연산 리스트로 펼친다 */
  function minute(){
    OUT.length = 0;

    k=0;  asleep = asleepAt(s.hour);
    op('cmp', 'hour '+rp(s.hour,2)+' in SLEEP['+(P.SLEEP_FROM<0?'none':P.SLEEP_FROM+','+P.SLEEP_TO)+']',
       null, null); OUT[OUT.length-1].dec = 'asleep=' + (asleep?1:0);

    k=1;  kf = asleep ? P.SLEEP_FACTOR : 1;
    op('ld ', asleep ? 'SLEEP_FACTOR' : 'imm 1.0', Q(kf), kf);

    k=2;  s.stage = Math.min(3, Math.floor(s.lv/33));
    op('ld ', 'STAGE['+s.stage+']  lv '+rp(s.lv,2), Q(ST[s.stage]), ST[s.stage]);

    k=3;  op('ld ', 'FUEL_DECAY', Q(P.FUEL_DECAY), P.FUEL_DECAY);
    k=4;  let t1 = P.FUEL_DECAY * ST[s.stage];
          op('mul', 'FUEL_DECAY * STAGE', Q(t1), t1);
    k=5;  d = t1 * kf;
          op('mul', 'acc * k', Q(d), d);
    k=6;  const f0 = s.fuel; s.fuel = Math.max(0, s.fuel - d);
          op('sub', 'fuel '+dec(f0)+' - acc', Q(s.fuel), s.fuel);
          if(s.fuel <= 0 && f0 > 0) ev('FUEL_EMPTY', 'clamped at 0');

    k=7;  op('ld ', 'MOOD_DECAY', Q(P.MOOD_DECAY), P.MOOD_DECAY);
    k=8;  md = P.MOOD_DECAY * kf;
          op('mul', 'acc * k', Q(md), md);
    k=9;  const m0 = s.mood; s.mood = Math.max(0, s.mood - md);
          op('sub', 'mood '+dec(m0)+' - acc', Q(s.mood), s.mood);
          if(s.mood <= 0 && m0 > 0) ev('MOOD_EMPTY', 'clamped at 0');

    k=10; if(!asleep && s.scrap < 4){
            const r = rnd();
            op('rnd', 'u < SCRAP_RATE '+dec(P.SCRAP_RATE), Q(r), r);
            if(r < P.SCRAP_RATE){ s.scrap++; ev('SCRAP', 'scrap := '+s.scrap); }
          } else op('skp', asleep ? 'scrap  (asleep)' : 'scrap  (scrap=4)', null, null);

    k=11; if(!s.fault && s.scrap > 0){
            const thr = s.scrap * P.FAULT_PER_SCRAP, r = rnd();
            op('rnd', 'u < '+s.scrap+'*FAULT_PER_SCRAP '+dec(thr), Q(r), r);
            if(r < thr){ s.fault = true; s.dose = 0;
              ev('FAULT_SET', 'DOSE_REQUIRED '+P.DOSE_REQUIRED+'  dose 0'); }
          } else op('skp', s.fault ? 'fault  (already set)' : 'fault  (scrap=0)', null, null);

    k=12; s.faultMin  = s.fault     ? s.faultMin + 1  : 0;
          s.starveMin = s.fuel <= 0 ? s.starveMin + 1 : 0;
          op('cnt', 'starve '+rp(s.starveMin,5)+' / '+P.STARVE_LIMIT+
                    '   fault '+rp(s.faultMin,5)+' / '+P.FAULT_LIMIT, null, null);

    k=13; const need = !asleep && (s.fuel <= 0 || s.mood <= 0);
          if(need){
            if(!s.call){ s.call = true; s.callMin = 0; s.called = false;
              op('cmp', 'call raise', null, null);
              ev('CALL_RAISE', 'axis '+(s.fuel<=0?'fuel':'mood')+'  grace '+P.CALL_GRACE); }
            else { s.callMin++;
              op('cmp', 'call held  '+rp(s.callMin,4)+' / '+P.CALL_GRACE, null, null);
              if(s.callMin >= P.CALL_GRACE && !s.called){ s.mistakes++; s.called = true;
                ev('CALL_UNANSWERED', 'mistakes := '+s.mistakes); } }
          } else { if(s.call) op('cmp', 'call clear', null, null);
                   else op('cmp', 'call  none', null, null);
                   s.call = false; }

    k=14; if(asleep){
            s.darkMin++;
            if(s.light){ op('cmp', 'light on while asleep  '+rp(s.darkMin,4)+' / '+P.NIGHT_GRACE, null, null);
              if(s.darkMin >= P.NIGHT_GRACE && !s.nightCounted){ s.mistakes++; s.nightCounted = true;
                ev('NIGHT_UNANSWERED', 'mistakes := '+s.mistakes); } }
            else op('cmp', 'light off', null, null);
          } else { s.darkMin = 0; s.nightCounted = false; s.light = true;
                   op('skp', 'night  (awake)', null, null); }

    grew = !asleep && s.fuel > 0 && s.mood > 0 && !s.fault;
    k=15; if(grew){
            let den = 1 + P.MISTAKE_DRAG * s.mistakes, cl = false;
            if(den < 0.1){ den = 0.1; cl = true; }
            const g = P.GROWTH_GAIN / den;
            op('div', 'GAIN / (1 + DRAG*'+s.mistakes+')  den '+dec(den), Q(g), g);
            if(cl) ev('DEN_CLAMP', 'denominator clamped to 0.1');
            k=16; s.exp += g; op('add', 'exp +=', Q(s.exp), s.exp);
          } else {
            op('skp', 'growth  ('+(asleep?'asleep':s.fault?'fault':s.fuel<=0?'fuel 0':'mood 0')+')', null, null);
            k=16; op('skp', 'exp    (no gain)', null, null);
          }

    k=17; const pl = s.lv, ps = s.stage;
          s.lv = Math.min(99, Math.floor(s.exp / 60));
          op('cmp', 'lv = exp/60', null, null); OUT[OUT.length-1].dec = rp(s.lv,2);
          if(s.lv > pl) ev('LEVEL', 'lv '+rp(pl,2)+' -> '+rp(s.lv,2), 'g');

    R('terminal     soul_panic("' + s.term + '")');
